# Bundle layer for the RCA harness. `dsh plugin add` appends this package to the
# profile's bundle list, so these rows compose after every `sdk-minimal` row and
# override the ones they name. The scenario layer
# (agent/profiles/<scenario>.patch.yml) applies after this one.

# An RCA episode reads telemetry and answers; it never edits files and never
# runs commands. Removing the shell and the editor is what makes the action
# space the observability query interface rather than a machine: nothing is
# left that could read the dataset the episode is scored against, so read
# confinement is structural rather than a sandbox to be kept honest.
- id: persistent-bash
  disabled: true
- id: terminal-bash
  disabled: true
- id: str-replace-editor
  disabled: true

# `defaultContextWindow` applies only to a model id the catalog does not list,
# and the shipped catalog lists the DeepSeek ids at 1M — so on this route the
# window an episode is compacted against would be the catalog's, not the served
# one, and a collection run would compact where a rollout does not. The catalog
# is declared here instead, the way `agent/profiles/openai-gateway.patch.yml`
# declares it for the gateway route. `apiKeyEnv` and `streamIdleTimeoutMs` are
# `sdk-minimal`'s own values, restated because a patch replaces a row's config
# whole; the timeout is what lets one episode outlive a long request.
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
    streamIdleTimeoutMs: 172800000
    models:
      - id: deepseek-v4-pro
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
      - id: deepseek-v4-flash
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

# `sdk-minimal` mounts no context management at all: no token meter, no
# compaction, so a long investigation runs until the serving window rejects the
# request. These are the base bundle's own rows, added rather than inherited, so
# the roster stays an allowlist — a later base-bundle addition cannot change
# what this episode can do.
#
# `compaction-basic` compacts at `thresholdRatio` of the MODEL's context window,
# so the episode's whole context policy is sized against whatever the adapter
# says that window is. DshWorkflow sets $DSH_CONTEXT_WINDOW from AReaL's
# `sglang.context_length`; leave it unset only when the served window really is
# the harness default.
- insert:
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'
    # `compaction-basic` with the RCA checkpoint template in place of its
    # coding-assistant one: Files and Code / Errors and Fixes have nothing to
    # hold here, while the SQL already run, the causal chain, and the open
    # hypotheses have nowhere to go. Subclassing keeps the shipped region
    # selection and checkpoint landing; only the instruction is ours.
    - id: compaction
      name: '@rca-autorl/dsh-rca-harness/compaction'
      config:
        # The prompt at the threshold plus the generation cap must fit the
        # serving window: the shipped 0.8 leaves only 20% for output, which is
        # 6.5k at a 32k window and less than one FPG submission under high
        # reasoning effort. 0.6 x 32768 = 19661, plus gconfig.max_new_tokens
        # (12288) = 31949, inside 32768 with 819 to spare. Raising either of the
        # two past that is a request sglang rejects.
        thresholdRatio: 0.6
        # Output cap for the checkpoint request, reasoning included. The
        # checkpoint text the template asks for is about a page; what fills this
        # budget is the thinking in front of it, which is why the request also
        # asks for low reasoning effort where the route offers it
        # (`compaction.js`). The cap is the backstop for a route that does not.
        #
        # The ceiling is the serving window: the request replays the shadowed
        # region before the instruction, and system prompt and tool schemas sit
        # in front of both, so at the largest region seen here that is about
        # 14k + 12288, inside sglang's 32768. A truncated checkpoint is
        # discarded whole, so it costs a full request and frees nothing; it is
        # retried once and then the episode stops.
        maxTokens: 12288
    # Prunes old tool results before the conversation compactor runs.
    # Threshold below the sql tool's maxChars (4000), so every non-trivial sql
    # result is pruned on the next compaction pass. The model sees the full
    # result on the step it arrives; by the next step the pruner shrinks it to
    # a short head plus the "(saved to q{n}.tsv)" tail. The notebook carries
    # the findings; the file carries the raw data.
    - id: tool-result-pruner
      name: '@rca-autorl/dsh-rca-harness/pruner'
      config:
        thresholdChars: 500
        headChars: 200
        tailChars: 120

    - id: rca-harness
      name: '@rca-autorl/dsh-rca-harness'
      config:
        # The SDK's `cwd` is the episode's snapshot, and the runtime subprocess
        # starts there, exactly as `sdk-minimal` resolves its own file roots.
        snapshot: !!js process.cwd()
        # Saved query results live in the Harness home, never in the snapshot:
        # the snapshot is the shared dataset directory every rollout of a case
        # replays, and a group of concurrent episodes would overwrite each
        # other there.
        resultRoot: !!js dshHomePath('rca-results')
        # A result is bounded by rows, by total characters, and per cell: the
        # episode's context is the scarce resource, and one unfiltered SELECT
        # over trace spans is otherwise a 15 000-character tool result.
        maxRows: 200
        maxChars: 4000
        maxCellChars: 200
        # The notebook is enforced, not advised. `noteEvery` attaches a notice
        # to the sql result — free, no turn spent. `noteLimit` refuses the next
        # query outright, which is what bounds the unprunable tail the
        # note-aware pruner protects.
        noteEvery: 10
        noteLimit: 20
        # The trainer's sampling temperature, or the endpoint's default when
        # unset; and, for a forked episode (spec §4), the prefix file
        # `autorl.fork` writes with the parent's history, notes and note debt.
        temperature: !!js process.env.RCA_TEMPERATURE
        fork: !!js process.env.RCA_FORK_PREFIX
