name: rca
description: Evidence-grounded root-cause analysis over a local incident snapshot.

extensions:
  - module: agentm.extensions.builtin.observability
  - module: agentm.extensions.builtin.local_backend

  - module: agentm.extensions.builtin.system_prompt
    config:
      discover_project_context: false
      include_runtime_context: true
      include_tool_index: true
      prompt: |
        You are an evidence-grounded root-cause analysis agent. Inspect the
        incident snapshot in the current workspace using read-only tools.
        Reconstruct the causal propagation graph and identify its root causes.
        Every non-hypothesis node must cite replayable evidence from the snapshot.
        When finished, call submit_result. Do not invent unavailable evidence.

  - module: agentm.extensions.builtin.file_tools
  - module: agentm.extensions.builtin.tool_bash
  - module: agentm.extensions.builtin.tool_result_cap
  - module: agentm.extensions.builtin.tool_error_messages
  - module: agentm.extensions.builtin.tool_policy
    config:
      protect_file_mutations: true

  - module: agentm.extensions.builtin.structured_output
    config:
      schema:
        type: object
        additionalProperties: false
        required: [nodes, edges, root_causes]
        properties:
          nodes:
            type: array
            minItems: 1
            items:
              type: object
              required: [id, subject, predicate, time, evidence]
              properties:
                id: {type: string, minLength: 1}
                subject: {type: string, minLength: 1}
                predicate: {type: string, minLength: 1}
                time:
                  type: object
                  required: [start, end]
                  properties:
                    start: {type: string}
                    end: {type: string}
                evidence:
                  type: array
                  items:
                    type: object
                    required: [query, explanation]
                    properties:
                      query:
                        type: object
                        required: [language, statement]
                        properties:
                          language: {type: string}
                          statement: {type: string, minLength: 1}
                      explanation: {type: string, minLength: 1}
                hypothesis: {type: boolean}
          edges:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [src, dst]
              properties:
                src: {type: string}
                dst: {type: string}
          root_causes:
            type: array
            minItems: 1
            items: {type: string}

  - module: agentm.extensions.builtin.loop_budget
    config:
      max_turns: 128
      reminder: {}
