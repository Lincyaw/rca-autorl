[project]
name = "rca-autorl"
version = "0.1.0"
description = "Minimal AReaL-based agent training demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "areal[sglang]>=2.0.0,<3.0.0",
    "deepseek-harness-sdk>=0.1.2rc1",
    "fpg>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pre-commit>=4.3",
    "ruff>=0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
areal = { path = "third_party/AReaL", editable = true }
# The fault propagation graph contract: the shape `submit_result` accepts and
# the ground truth will be re-annotated into. Pinned by commit — the schema is
# a contract between this repository, the annotation, and the verifier, so it
# moves only when all three do.
fpg = { git = "https://github.com/Lincyaw/fpg-convention.git", rev = "1be954208b6bb4ffbdd6bd9db0c0357d5d415990" }
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = [
    "openai>=2.8.0",
    "soundfile>=0.12.1,<0.13.0",
    "torchao==0.15.0",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "areal.*",
    "deepseek_harness.*",
    "deepseek_harness_runtime.*",
    "datasets.*",
    # fpg ships no py.typed marker; it is a pydantic package, so what reaches
    # this repository is validated at runtime either way.
    "fpg.*",
]
ignore_missing_imports = true
