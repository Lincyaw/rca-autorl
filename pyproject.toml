[project]
name = "rca-autorl"
version = "0.1.0"
description = "Minimal AReaL-based agent training demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "areal[sglang]",
    "agentm[eval]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pre-commit>=4.3",
    "ruff>=0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
areal = { path = "third_party/AReaL", editable = true }
agentm = { git = "https://github.com/Lincyaw/AgentM.git", rev = "7ebc5ef923550a699e628017a0d37630eec76007" }
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = [
    # AgentM's RCA scenario requires >=3.4.2; AReaL's 3.3 pin is not used by
    # this thin workflow and would otherwise make the editable deps unsatisfiable.
    "networkx>=3.4.2",
    "openai>=2.8.0",
    "soundfile>=0.12.1,<0.13.0",
    "torchao==0.15.0",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "areal.*",
    "datasets.*",
    "fpg.*",
    "rca_eval.*",
]
ignore_missing_imports = true
