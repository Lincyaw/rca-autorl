[project]
name = "rca-autorl"
version = "0.1.0"
description = "Minimal AReaL-based agent training demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.13.0",
    "areal",
    "colorlog>=6.9.0",
    "datasets>=3.6.0",
    "fastapi>=0.116.0",
    "flask>=3.1.0",
    "httpx>=0.28.0",
    "json5>=0.12.0",
    "openai>=2.8.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "pysocks>=1.7.1",
    "qwen-agent>=0.0.31",
    "sglang[tracing]==0.5.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "soundfile>=0.12.1,<0.13.0",
    "socksio>=1.0.0",
    "tiktoken>=0.12.0",
    "torch==2.9.1+cu129; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio==2.9.1+cu129; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.24.1+cu129; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers==4.57.1",
    "uvicorn[standard]>=0.35.0",
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.9-cp311-cp311-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.9-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
areal = { path = "third_party/AReaL", editable = true }
