[project]
name = "rca-autorl"
version = "0.1.0"
description = "Minimal AReaL-based agent training demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "areal[sglang]",
    "agentm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
areal = { path = "third_party/AReaL", editable = true }
agentm = { path = "third_party/agentm", editable = true }
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = [
    "openai>=2.8.0",
    "soundfile>=0.12.1,<0.13.0",
    "torchao==0.15.0",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
