experiment_name: autorl-agentm-trajectory-sft
trial_name: qwen3.5-4b-searcher-clean-q16-e2-64k-megatron-p4t2-adambf16-v1

seed: 1
total_train_epochs: 1
total_train_steps: null
tokenizer_path: ${actor.path}

scheduler:
  type: local

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: .runs/agentm-trajectory-sft-qwen3.5-4b-searcher-clean-q16-e2-64k-megatron-p4t2-adambf16-v1
  name_resolve:
    type: nfs
    nfs_record_root: .runs/agentm-trajectory-sft-qwen3.5-4b-searcher-clean-q16-e2-64k-megatron-p4t2-adambf16-v1/name_resolve

train_dataset:
  type: sft
  path: .runs/data/agentm-trajectory-sft-qwen3.5-9b-searcher-clean-q16-e2/train.jsonl
  batch_size: 8
  shuffle: true
  pin_memory: false
  num_workers: 0
  max_length: 65536

# Keep AReaL's built-in LM eval off for this run; previous SFT eval hit a
# masking_utils edge case after checkpoint save. We will evaluate via AgentM.
valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 100
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 100
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false

actor:
  # Qwen3.5 GDN does not support context parallel in AReaL/Megatron today, so
  # this shards by pipeline+tensor parallelism instead of CP.
  backend: "megatron:d1p4t2"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: .runs/models/Qwen3.5-4B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    n_mbs: 8
    max_tokens_per_mb: 65536
  optimizer:
    type: adam_bf16
    lr: 1e-5
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.95
    eps: 1e-5
    lr_scheduler_type: cosine
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  megatron:
    bridge_type: megatron-bridge
    use_bridge_for_update_weights: true
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 8
      mem: 48
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}
