experiment_name: autorl-dsh-rca-sft-smoke
trial_name: local-smoke

seed: 1
total_train_epochs: 1
total_train_steps: 1
tokenizer_path: ${actor.path}

scheduler:
  type: local

cluster:
  n_nodes: 1
  n_gpus_per_node: 1
  fileroot: .runs/dsh-rca-sft-smoke
  name_resolve:
    type: nfs
    nfs_record_root: .runs/dsh-rca-sft-smoke/name_resolve

# Distill output from llmharness — extractor.jsonl carries 190 rows of
# {input.{system,user}, target.messages[<think>...</think> + tool_calls]}
# for the 10-case sft-10case-2026-05-18 bundle. Path is relative to the
# rca-autorl working dir; override with -p train_dataset.path=... when
# pointing at a different distill output.
train_dataset:
  type: sft
  path: .runs/sft/rca_sessions.jsonl
  batch_size: 1
  shuffle: true
  pin_memory: false
  num_workers: 0
  max_length: 32768

valid_dataset:
  type: sft
  path: .runs/sft/rca_sessions.jsonl
  batch_size: 1
  shuffle: false
  pin_memory: false
  num_workers: 0
  max_length: 32768

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

actor:
  backend: "fsdp:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  # Qwen3-4B-Thinking-2507 — native <think> tag support, vocab/template
  # matches the distill output's Qwen/GLM shape (assistant.content
  # carries <think>...</think>; tool_calls list carries the terminal
  # submit_events / submit_verdict call).
  path: Qwen/Qwen3-4B-Thinking-2507
  init_from_scratch: false
  gradient_checkpointing: true
  dtype: bfloat16
  attn_impl: sdpa
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 1e-5
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.95
    eps: 1e-5
    lr_scheduler_type: cosine
    gradient_clipping: 1.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 16
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}
