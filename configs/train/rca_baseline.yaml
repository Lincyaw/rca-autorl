experiment_name: autorl-rca-baseline
trial_name: cold-7b

seed: 1
enable_offload: false
total_train_epochs: 3
total_train_steps: null
tokenizer_path: ${actor.path}

workflow: autorl.workflows.agent.AReaLNativeAgentWorkflow
eval_workflow: ${workflow}
infer_workflow: ${workflow}
task_adapter_path: autorl.tasks.rca.RCATaskAdapter
agent_runtime_path: autorl.runtime.agentm.AgentMRuntime
reward_strategy_path: autorl.rewards.rca.RCABaselineRewardStrategy
tool_gateway_mode: local
tool_gateway_base_url: null
env_gateway_mode: none
env_gateway_base_url: null
trace_dir: .runs/rca-baseline/trajectories

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: .runs/rca-baseline
  name_resolve:
    type: nfs
    nfs_record_root: .runs/rca-baseline/name_resolve

scheduler:
  type: local

rollout:
  backend: "sglang:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 96
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  openai:
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 4096
  greedy: false
  temperature: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-4B-Thinking-2507
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 8192
  optimizer:
    type: adam
    lr: 5e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  adv_norm:
    mean_level: batch
    std_level: batch
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 8192
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.85

train_dataset:
  batch_size: 64
  shuffle: true
  pin_memory: true
  type: rl
  # AgentM-processed RCA dataset; rows carry datapack_name +
  # ground_truth and the RCATaskAdapter resolves data_dir via
  # AGENTM_RCA_DATASET_ROOT. Same file for train + valid until a
  # held-out split is materialized.
  path: /home/ddq/AoyangSpace/dataset/rca/data.jsonl

valid_dataset:
  batch_size: 64
  shuffle: false
  pin_memory: true
  type: rl
  path: /home/ddq/AoyangSpace/dataset/rca/data.jsonl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 200
  freq_secs: 3600

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: ${cluster.fileroot}/autorl/tensorboard

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false

train_manifest_path: null
valid_manifest_path: null
train_dataset_revision: main
valid_dataset_revision: main
max_llm_calls_per_run: 100
max_tokens_per_trajectory: 32768
max_tokens_per_turn: 4096
judge_engine_addr: null
infer_max_items: 16
allow_train_fallback_for_eval: false
allow_train_fallback_for_infer: false
