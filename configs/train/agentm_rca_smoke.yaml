experiment_name: autorl-agentm-rca-smoke
trial_name: local-smoke

seed: 1
enable_offload: false
total_train_epochs: 1
total_train_steps: 1
tokenizer_path: ${actor.path}

econfig:
  scenario: rca
  model: default
  dataset_root: ${oc.env:AGENTM_RCA_DATASET_ROOT,""}
  max_turns: 128
  timeout: 1800.0

cluster:
  n_nodes: 1
  n_gpus_per_node: 1
  fileroot: .runs/agentm-rca-smoke
  name_resolve:
    type: nfs
    nfs_record_root: .runs/agentm-rca-smoke/name_resolve

scheduler:
  type: local

rollout:
  backend: "sglang:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 1
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 512
  greedy: false
  temperature: 0.7

actor:
  backend: "fsdp:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-4B-Thinking-2507
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  attn_impl: sdpa
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer:
    type: adam
    lr: 5e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  adv_norm:
    mean_level: batch
    std_level: batch
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 16
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  attn_impl: ${actor.attn_impl}
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.7

# RL data — directly consumes AgentM's processed RCA dataset. Each
# row carries {id/source, question, ground_truth, fault_type,
# datapack_name}; AgentMWorkflow resolves data_dir by joining
# econfig.dataset_root with datapack_name. Default points
# at the canonical workspace dataset; override with `-p
# train_dataset.path=...` when pointing at a different jsonl.
train_dataset:
  batch_size: 1
  shuffle: false
  pin_memory: false
  type: rl
  path: /home/ddq/AoyangSpace/dataset/rca/data.jsonl

valid_dataset:
  batch_size: 1
  shuffle: false
  pin_memory: false
  type: rl
  path: /home/ddq/AoyangSpace/dataset/rca/data.jsonl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 100
  freq_secs: 3600

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: ${cluster.fileroot}/autorl/tensorboard

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
