# data assumed: see llmharness-distill rl-prompts / annotate-case-outcome
#
# Pure SFT baseline on the auditor distill output. No RL. Pattern
# follows configs/sft/agentm_rca_sft_smoke.yaml. Replace ``sft-XX``
# with the actual distill bundle name (e.g. sft-10case-2026-05-18).
experiment_name: autorl-llmharness-auditor-sft-baseline
trial_name: local

seed: 1
total_train_epochs: 1
total_train_steps: 1
tokenizer_path: ${actor.path}

scheduler:
  type: local

cluster:
  n_nodes: 1
  n_gpus_per_node: 1
  fileroot: .runs/llmharness-auditor-sft-baseline
  name_resolve:
    type: nfs
    nfs_record_root: .runs/llmharness-auditor-sft-baseline/name_resolve

train_dataset:
  type: sft
  path: ${LLMHARNESS_RUNS_DIR}/sft-XX/auditor.jsonl
  batch_size: 1
  shuffle: true
  pin_memory: false
  num_workers: 0
  max_length: 32768

valid_dataset:
  type: sft
  path: ${LLMHARNESS_RUNS_DIR}/sft-XX/auditor.jsonl
  batch_size: 1
  shuffle: false
  pin_memory: false
  num_workers: 0
  max_length: 32768

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

actor:
  backend: "fsdp:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-4B-Thinking-2507
  init_from_scratch: false
  gradient_checkpointing: true
  dtype: bfloat16
  attn_impl: sdpa
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 1e-5
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.95
    eps: 1e-5
    lr_scheduler_type: cosine
    gradient_clipping: 1.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 16
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}
