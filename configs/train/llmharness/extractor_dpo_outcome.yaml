# data assumed: see llmharness-distill rl-prompts / annotate-case-outcome
#
# SFT + DPO with outcome-graded preference pairs. NOTE: AReaL does not
# currently ship a DPO trainer (no ``trainer: dpo`` config block in
# third_party/AReaL); the trainer-specific keys below follow TRL's
# DPOConfig defaults so the config is implementable against either an
# AReaL DPO trainer once it lands or a TRL bridge.
#
# DPO doesn't actually call ``reward_strategy.compute(...)`` during
# training — the preference signal is baked into the (chosen, rejected)
# pairs. Pinning the outcome strategy here lets eval reuse the same
# composite_score on held-out cases.
experiment_name: autorl-llmharness-extractor-dpo-outcome
trial_name: local

seed: 1
total_train_epochs: 1
total_train_steps: 1
tokenizer_path: ${actor.path}

task_adapter_path: autorl.tasks.llmharness_firing.LlmharnessExtractorFiringTaskAdapter
agent_runtime_path: autorl.runtime.llmharness_extractor.LlmharnessExtractorRuntime
reward_strategy_path: autorl.rewards.llmharness_extractor_outcome.LlmharnessExtractorOutcomeRewardStrategy

scheduler:
  type: local

cluster:
  n_nodes: 1
  n_gpus_per_node: 1
  fileroot: .runs/llmharness-extractor-dpo-outcome
  name_resolve:
    type: nfs
    nfs_record_root: .runs/llmharness-extractor-dpo-outcome/name_resolve

# DPO pair dataset — see autorl.data.dpo_pairs loader.
pair_dataset:
  type: dpo_pairs
  path: ${LLMHARNESS_RUNS_DIR}/sft-XX/dpo_pairs.jsonl
  phase: extractor
  batch_size: 1
  shuffle: true
  max_length: 16384

train_dataset:
  type: dpo_pairs
  path: ${pair_dataset.path}
  batch_size: ${pair_dataset.batch_size}
  shuffle: ${pair_dataset.shuffle}

valid_dataset:
  type: dpo_pairs
  path: ${pair_dataset.path}
  batch_size: 1
  shuffle: false

# DPO-specific hyperparameters (TRL defaults).
dpo:
  beta: 0.1                 # KL temperature
  loss_type: sigmoid        # {sigmoid, hinge, ipo, kto_pair}
  label_smoothing: 0.0
  reference_free: false

actor:
  backend: "fsdp:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  # Initialize from the SFT checkpoint produced by extractor_sft_baseline.yaml.
  path: Qwen/Qwen3-4B-Thinking-2507
  init_from_scratch: false
  gradient_checkpointing: true
  dtype: bfloat16
  attn_impl: sdpa
  mb_spec:
    max_tokens_per_mb: 16384
  optimizer:
    type: adam
    lr: 5e-7              # DPO uses a smaller LR than SFT
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: cosine
    gradient_clipping: 1.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 16
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

# DPO needs a frozen reference policy.
ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  attn_impl: ${actor.attn_impl}
  mb_spec:
    max_tokens_per_mb: ${actor.mb_spec.max_tokens_per_mb}
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
