experiment_name: autorl-agent-smoke
trial_name: local-smoke

seed: 1
enable_offload: false
total_train_epochs: 2
total_train_steps: 2
tokenizer_path: ${actor.path}

workflow: autorl.workflows.agent.AReaLNativeAgentWorkflow
eval_workflow: ${workflow}
infer_workflow: ${workflow}
task_adapter_path: autorl.tasks.search.SearchTaskAdapter
agent_runtime_path: autorl.runtime.stub.StubAgentRuntime
reward_strategy_path: autorl.rewards.local.ReferenceMatchRewardStrategy
tool_gateway_mode: local
tool_gateway_base_url: null
env_gateway_mode: none
env_gateway_base_url: null
trace_dir: null

cluster:
  n_nodes: 1
  n_gpus_per_node: 1
  fileroot: .runs/areal-smoke
  name_resolve:
    type: nfs
    nfs_record_root: .runs/areal-smoke/name_resolve

scheduler:
  type: local

rollout:
  backend: "sglang:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 2
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  openai:
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 256
  greedy: false
  temperature: 1.0

actor:
  backend: "fsdp:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-1.5B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer:
    type: adam
    lr: 5e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  adv_norm:
    mean_level: batch
    std_level: batch
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 16
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 8192
  mem_fraction_static: 0.7

train_dataset:
  batch_size: 2
  shuffle: true
  pin_memory: false
  type: rl
  path: configs/train/smoke_samples.jsonl

valid_dataset:
  batch_size: 2
  shuffle: false
  pin_memory: false
  type: rl
  path: configs/train/smoke_samples.jsonl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 100
  freq_secs: 3600

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: ${cluster.fileroot}/autorl/tensorboard

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false

train_manifest_path: null
valid_manifest_path: null
train_dataset_revision: null
valid_dataset_revision: null
max_llm_calls_per_run: 12
max_tokens_per_trajectory: 4096
max_tokens_per_turn: 256
judge_engine_addr: null
infer_max_items: 2
allow_train_fallback_for_eval: false
allow_train_fallback_for_infer: false
