experiment_name: autorl-dsh-rca-smoke
trial_name: local-smoke

seed: 1
dynamic_bs: false  # every group enters the batch; a tied group has zero advantage (spec §3.2)
enable_offload: false
total_train_epochs: 1
total_train_steps: 1
tokenizer_path: ${actor.path}

econfig:
  scenario: rca
  dataset_root: ${oc.env:RCA_DATASET_ROOT,""}
  dsh_home: ${cluster.fileroot}/dsh-home
  timeout: 1800.0
  # Sibling difficulty weighting of the graph score (method spec §3.1);
  # false is the flat-score ablation arm.
  difficulty: true
cluster:
  n_nodes: 1
  n_gpus_per_node: 1
  fileroot: .runs/dsh-rca-smoke
  name_resolve:
    type: nfs
    nfs_record_root: .runs/dsh-rca-smoke/name_resolve

scheduler:
  type: local

rollout:
  backend: "sglang:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 1
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    # The rollout proxy binds this node's routable address, not loopback, and
    # AReaL refuses to expose admin endpoints (grant_capacity, start_session,
    # export_trajectories) there under the key its own source documents. Any
    # value other than `areal-admin-key` is accepted; only the default is not.
    admin_api_key: ${oc.env:AREAL_ADMIN_KEY,rca-local-key}

gconfig:
  n_samples: 8
  min_new_tokens: 0
  # The harness sends this as the request's `max_tokens`. Reasoning shares the
  # budget with the answer: at 4096 under high reasoning effort an episode spent
  # the whole cap thinking and never emitted submit_result, and at 8192 a
  # submission of eight evidence-carrying nodes stopped at exactly 8193 output
  # tokens with `edges` and `root_causes` unwritten — the registry rejected it
  # and the retry cost a second full generation.
  #
  # The ceiling is arithmetic, not taste. Compaction triggers at the rca-harness
  # row's thresholdRatio (0.6) of sglang.context_length, so the prompt can be
  # 19661 tokens when a request goes out and the whole request must still fit
  # 32768: anything above 13107 is a request the server rejects. 12288 leaves
  # 819 tokens of margin.
  max_new_tokens: 12288
  greedy: false
  temperature: 0.7
  reward_normalization: false
  drop_incomplete_group: true

actor:
  backend: "fsdp:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-4B-Thinking-2507
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  attn_impl: sdpa
  mb_spec:
    # A micro-batch must hold the longest packed sequence or the packer raises
    # rather than splitting it (`Values [N] is larger than capacity M`), and
    # with `export_style: individual` one row is one whole request: a prompt
    # grown to the compaction threshold plus `max_new_tokens`. The context
    # length is that bound, so it is the smallest value that cannot fail.
    max_tokens_per_mb: ${sglang.context_length}
  optimizer:
    type: adam
    lr: 5e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.2
  eps_clip_higher: 0.28
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  reward_clip: 5.0
  # The centring of spec §3.2. RLOO: mean_leave1out true, std_level null.
  # GRPO: mean_leave1out false, std_level group. algorithm.py rejects others.
  reward_norm:
    mean_level: group
    mean_leave1out: true
    std_level: null
    group_size: ${gconfig.n_samples}
  adv_norm: null
  discount: 1.0
  gae_lambda: 1.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 16
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  attn_impl: ${actor.attn_impl}
  mb_spec:
    max_tokens_per_mb: ${actor.mb_spec.max_tokens_per_mb}
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.7

# RL data — directly consumes the processed RCA dataset. Each
# row carries {id/source, question, ground_truth, fault_type,
# datapack_name}; DshWorkflow resolves data_dir by joining
# econfig.dataset_root with datapack_name. The default is the corpus this
# repository prepares — `python -m autorl.dataset datapacks/ops-lite` writes it,
# and the path is relative so a checkout is self-contained. Point elsewhere with
# `train_dataset.path=...`.
train_dataset:
  batch_size: 1
  shuffle: false
  pin_memory: false
  type: rl
  path: datapacks/ops-lite/train.jsonl

valid_dataset:
  batch_size: 1
  shuffle: false
  pin_memory: false
  type: rl
  path: datapacks/ops-lite/eval.jsonl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 100
  freq_secs: 3600

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: ${cluster.fileroot}/autorl/tensorboard

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
