      - path: src/autorl/tasks/search_runtime.py
      - path: src/autorl/tasks/search_reward.py
    tests: []
    conflicts: []

  - id: REQ-011
    title: Train/eval/infer entrypoints
    description: >
      Thin CLI entrypoints that wire configs to UnifiedAgentWorkflow for
      training, evaluation, and inference phases.
    priority: P1
    status: implemented
    confidence: confirmed
    source: src/autorl/experiments/agent_workflow/
    code:
      - path: src/autorl/experiments/agent_workflow/train.py
      - path: src/autorl/experiments/agent_workflow/eval.py
      - path: src/autorl/experiments/agent_workflow/infer.py
      - path: src/autorl/experiments/agent_workflow/configs.py
