  - id: REQ-012
    title: ReAct agent implementation
    description: >
      Built-in ReAct-style agent with tool_search, tool_visit, and prompt
      tools for the tool_env gateway.
    priority: P2
    status: implemented
    confidence: inferred
    source: src/autorl/agents/
    code:
      - path: src/autorl/agents/react_agent.py
      - path: src/autorl/agents/runner.py
      - path: src/autorl/agents/tool_search.py
      - path: src/autorl/agents/tool_visit.py
      - path: src/autorl/agents/prompt.py
      - path: src/autorl/agents/shared.py
    tests: []
