# Requirements Index — rca-autorl
# Design specs for AReaL-first RL training scaffold (2026-04-12)
# This is a new project — requirements reflect design intent, not recovery.

requirements:
  - id: REQ-001
    title: Framework-agnostic contracts
    description: >
      Canonical data formats (TaskSample, AgentInput, Trajectory, TrajectoryStep,
      TaskOutcome, RuntimeContext) that decouple task/runtime/reward logic from
      any specific agent framework or training substrate.
    priority: P0
    status: implemented
    confidence: confirmed
    source: src/autorl/contracts/, .doc/designs/design.md
    code:
      - path: src/autorl/contracts/task.py
      - path: src/autorl/contracts/trajectory.py
      - path: src/autorl/contracts/outcome.py
      - path: src/autorl/contracts/runtime.py
      - path: src/autorl/contracts/common.py
      - path: src/autorl/contracts/training.py
    tests: []
    conflicts: []

  - id: REQ-002
    title: Unified AReaL-native agent workflow
    description: >
      Single workflow entrypoint (UnifiedAgentWorkflow.run) that orchestrates
      sample validation → agent input → runtime execution → outcome extraction
      → reward computation → observability, conforming to AReaL's
      `async run(data, **extra_kwargs)` contract.
    priority: P0
    status: implemented
    confidence: confirmed
    source: src/autorl/runtime/agent_workflow.py, .doc/designs/design.md
    code:
      - path: src/autorl/runtime/agent_workflow.py
      - path: src/autorl/runtime/factory.py
      - path: src/autorl/runtime/base.py
    tests: []
    conflicts: []

  - id: REQ-003
    title: RCA task adapter (RCABench)
    description: >
      TaskAdapter for root cause analysis that normalizes RCABench samples
      (incident, data_dir, root_causes) into the contract layer and extracts
      prediction vs. reference root-cause sets for evaluation.
    priority: P0
    status: implemented
    confidence: confirmed
    source: src/autorl/tasks/rca.py, README.md
    code:
      - path: src/autorl/tasks/rca.py
    tests:
      - path: tests/test_rca_pipeline.py
    conflicts: []
    notes: >
      Accepts AgentM seed_dataset rows
      (source/question/ground_truth/fault_type/datapack_name); data_dir
      resolved via AGENTM_RCA_DATASET_ROOT + datapack_name. Also
      accepts explicit RL manifests with
      incident/data_dir/expected_services/fault_kind.

  - id: REQ-004
    title: AgentM runtime bridge
    description: >
      AgentRuntime implementation that delegates RCA episodes to the
      AgentM rca:harness.sync scenario via
      agentm_rca.eval.agent.AgentMAgent. Forwards AReaL's proxy
      endpoints to AgentM through OPENAI_BASE_URL / AGENTM_MODEL env vars.
    priority: P0
    status: implemented
    confidence: confirmed
    source: src/autorl/runtime/agentm.py, README.md
    code:
      - path: src/autorl/runtime/agentm.py
    tests: []
    conflicts: []
    notes: >
      Depends on the sibling ../AgentM working tree (editable install).

  - id: REQ-005
    title: RCA baseline reward
    description: >
      RewardStrategy computing the AgentM eval/baseline grader rubric
      (0.7 * service_hit + 0.3 * fault_kind_hit) so SFT supervision
      (from llmharness/distill labels) and RL reward share one rubric.
    priority: P0
    status: implemented
    confidence: confirmed
    source: src/autorl/rewards/rca.py
    code:
      - path: src/autorl/rewards/rca.py
      - path: src/autorl/rewards/base.py
      - path: src/autorl/rewards/registry.py
    tests:
      - path: tests/test_rca_pipeline.py
    conflicts: []

  - id: REQ-006
    title: Direct AgentM dataset reuse (no repo-owned builder)
    description: >
      Instead of a repo-owned RCABench manifest builder, autorl
      consumes the processed RCA dataset that AgentM already produces
      under $AGENTM_RCA_DATASET_ROOT/data.jsonl (seeded via
      agentm_rca.eval.seed_dataset). SFT data comes from
      llmharness/distill output bundles.
    priority: P1
    status: implemented
    confidence: confirmed
    source: README.md, configs/sft/agentm_rca_sft_smoke.yaml, configs/train/agentm_rca_smoke.yaml
    code: []
    tests: []
    conflicts: []
    notes: >
      Legacy src/autorl/data/rcabench.py and
      scripts/build_rcabench_dataset.py were removed in the 2026-05-19
      migration. autorl.tasks.rca.RCATaskAdapter reads the dataset
      directly.

  - id: REQ-007
    title: SFT training path on llmharness/distill JSONL
    description: >
      AReaL SFTTrainer entrypoint that tokenizes llmharness/distill
      output (input.{system,user} + target.messages[<think> +
      tool_calls]) through the Qwen3-Thinking chat template, masking
      the prompt and supervising only the assistant turn.
    priority: P1
    status: implemented
    confidence: confirmed
    source: src/autorl/experiments/agent_sft/train.py, src/autorl/data/sft.py
    code:
      - path: src/autorl/experiments/agent_sft/train.py
      - path: src/autorl/data/sft.py
    tests:
      - path: tests/test_rca_pipeline.py
    conflicts: []

  - id: REQ-008
    title: Tool/env gateway abstraction
    description: >
      ToolGateway and EnvGateway interfaces with local, null, and HTTP
      implementations. Supports local tool_env (search/visit/prompt tools)
      and remote gateway modes.
    priority: P1
    status: implemented
    confidence: confirmed
    source: src/autorl/gateways/, src/autorl/tool_env/
    code:
      - path: src/autorl/gateways/base.py
      - path: src/autorl/gateways/tool_env.py
      - path: src/autorl/gateways/null_env.py
      - path: src/autorl/tool_env/app.py
      - path: src/autorl/tool_env/client.py
      - path: src/autorl/tool_env/tools/search.py
      - path: src/autorl/tool_env/tools/visit.py
      - path: src/autorl/tool_env/tools/prompt.py
    tests: []
    conflicts: []

  - id: REQ-009
    title: Rollout observability and metrics
    description: >
      Per-episode metric collection (reward, success, turns, tool usage,
      token counts) published through AReaL stats_tracker. Run metadata
      persisted under cluster.fileroot/autorl/metadata. Trace sink for
      canonical trajectories.
    priority: P2
    status: implemented
    confidence: confirmed
    source: src/autorl/observability/, src/autorl/runtime/trace_sink.py
    code:
      - path: src/autorl/observability/metrics.py
      - path: src/autorl/observability/rollout.py
      - path: src/autorl/runtime/trace_sink.py
    tests: []
    conflicts: []

  - id: REQ-010
    title: Search task (reference example)
    description: >
      Example task adapter, runtime, and reward for search-style QA,
      serving as a reference implementation for the contract layer.
    priority: P2
    status: implemented
    confidence: confirmed
    source: src/autorl/tasks/search*.py, .doc/designs/design.md
    code:
